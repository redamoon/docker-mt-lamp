# psgi-nginx: 静的は nginx、動的だけ Starman。CGI スタック全体の置き換えではない。
# /cgi-bin/mt/ のプレフィクスは落とさない（MT::PSGI は CGIPath 配下にマウントする）。
worker_processes auto;
error_log /var/www/local/logs/nginx-error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64m;
    access_log /var/www/local/logs/nginx-access.log;

    upstream starman {
        server psgi-app-nginx:5001;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name localhost;

        # cgi / psgi も同じ docker/nginx/certs を読む（Apache は /etc/httpd/certs にマウント）
        ssl_certificate /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        root /var/www/local/html;
        index index.html index.htm;

        location /cgi-bin/mt/mt-static/ {
            alias /var/www/local/cgi-bin/mt/mt-static/;
        }

        location /cgi-bin/mt/ {
            proxy_pass http://starman/cgi-bin/mt/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
