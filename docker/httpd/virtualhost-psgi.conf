# psgi モード用。Apache が公開ディレクトリと mt-static を返し、動的部分だけ Starman へ。
# 未検証の本番構成。動作確認は psgi-dev を先に。
<VirtualHost *:80>
    DocumentRoot /var/www/local/html
    ServerName localhost

    <IfModule !proxy_module>
        LoadModule proxy_module modules/mod_proxy.so
    </IfModule>
    <IfModule !proxy_http_module>
        LoadModule proxy_http_module modules/mod_proxy_http.so
    </IfModule>

    ProxyPreserveHost On
    ProxyRequests Off

    Alias /cgi-bin/mt/mt-static /var/www/local/cgi-bin/mt/mt-static
    <Directory "/var/www/local/html">
        AllowOverride All
        Require all granted
        Options FollowSymLinks Includes
    </Directory>
    <Directory "/var/www/local/cgi-bin/mt/mt-static">
        Require all granted
        Options FollowSymLinks
    </Directory>

    ProxyPass /cgi-bin/mt/mt-static !
    # MT::PSGI は CGIPath（/cgi-bin/mt/）配下にマウントする。プレフィクスを落とすと /mt.cgi になり 404 になる。
    ProxyPass /cgi-bin/mt/ http://psgi-app:5001/cgi-bin/mt/
    ProxyPassReverse /cgi-bin/mt/ http://psgi-app:5001/cgi-bin/mt/

    ErrorLog /var/www/local/logs/error_log
    TransferLog /var/www/local/logs/access_log
</VirtualHost>
