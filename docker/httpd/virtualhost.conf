<VirtualHost *:80>
    DocumentRoot /var/www/local/html
    ServerName localhost
    Alias /cgi-bin/ /var/www/local/cgi-bin/
    AddHandler cgi-script .cgi
    <Directory "/var/www/local">
        AllowOverride All
        Order allow,deny
        Allow from all
        Options ExecCGI FollowSymLinks Includes
        AddType application/x-httpd-cgi .cgi .pl
        AddHandler image/gif .gif
        AddHandler image/jpg .jpg
    </Directory>
    <Directory "/var/www/local/cgi-bin/mt">
        CGIPassAuth On
    </Directory>
    ErrorLog /var/www/local/logs/error_log
    TransferLog /var/www/local/logs/access_log
</VirtualHost>

# HTTPS。HTTP への強制リダイレクトはしない。証明書は ./docker/nginx/certs（cgi/psgi もこれを読む）
<IfModule ssl_module>
    Listen 443
    <VirtualHost *:443>
        DocumentRoot /var/www/local/html
        ServerName localhost
        SSLEngine on
        SSLCertificateFile /etc/httpd/certs/localhost.crt
        SSLCertificateKeyFile /etc/httpd/certs/localhost.key
        Alias /cgi-bin/ /var/www/local/cgi-bin/
        AddHandler cgi-script .cgi
        <Directory "/var/www/local">
            AllowOverride All
            Order allow,deny
            Allow from all
            Options ExecCGI FollowSymLinks Includes
            AddType application/x-httpd-cgi .cgi .pl
            AddHandler image/gif .gif
            AddHandler image/jpg .jpg
        </Directory>
        <Directory "/var/www/local/cgi-bin/mt">
            CGIPassAuth On
        </Directory>
        ErrorLog /var/www/local/logs/error_log
        TransferLog /var/www/local/logs/access_log
    </VirtualHost>
</IfModule>
